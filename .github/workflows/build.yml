name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: pip install buildozer cython==0.29.36 setuptools

      - name: Compilar
        shell: bash
        run: buildozer android debug 2>&1 | tee build.log

      - name: Mostrar fim do erro
        if: failure()
        run: tail -n 60 build.log

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
