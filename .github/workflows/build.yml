name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Aceitar licenças Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Buildozer
        run: |
          pip install buildozer cython==0.29.36 setuptools

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Mostrar erro
        if: failure()
        run: |
          echo "===== ÚLTIMAS 60 LINHAS ====="
          grep -v '^# ' build.log | tail -n 60

          echo ""
          echo "===== LINHAS COM ERRO ====="
          grep -n -i -E "error|failed|fatal|exception|command failed" build.log \
            | grep -v -i -E "deprecated|warning" \
            | tail -n 40

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
